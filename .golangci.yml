version: "2"
run:
  # Integration tests are compiled only with this tag and would go unlinted.
  build-tags:
    - integration
linters:
  default: standard
  enable:
    - errorlint
    - gosec
    - misspell
    - revive
  exclusions:
    generated: strict
    paths:
      - internal/api/gen
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    paths:
      - internal/api/gen
