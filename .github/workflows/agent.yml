name: agent

on:
  pull_request:
  push:
    branches: [main]
    tags: ["agent/v*"]

concurrency:
  group: agent-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum
      - run: make agent-test
      - run: make lint-sh
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.5.0
          working-directory: agent

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum
      - run: make agent-it

  release:
    if: startsWith(github.ref, 'refs/tags/agent/v')
    needs: [test, integration]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum
      # goreleaser OSS cannot parse the agent/ prefix: build from the bare version
      # and publish under the original tag with gh.
      - run: echo "GORELEASER_CURRENT_TAG=${GITHUB_REF_NAME#agent/}" >> "$GITHUB_ENV"
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean --skip=validate --config deploy/goreleaser.yaml
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/checksums.txt \
            --title "pulse-agent $GORELEASER_CURRENT_TAG" --generate-notes
