name: agent

on:
  pull_request:
  push:
    branches: [main]
    tags: ["agent/v*"]

concurrency:
  group: agent-${{ github.ref }}
  # A cancelled main run could stop a deploy halfway or leave a pairing token behind.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum
      - run: make agent-test
      - run: make lint-sh
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.5.0
          working-directory: agent

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum
      - run: make agent-it

  release:
    if: startsWith(github.ref, 'refs/tags/agent/v')
    needs: [test, integration]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum
      # goreleaser OSS cannot parse the agent/ prefix: build from the bare version
      # and publish under the original tag with gh.
      - run: echo "GORELEASER_CURRENT_TAG=${GITHUB_REF_NAME#agent/}" >> "$GITHUB_ENV"
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean --skip=validate --config deploy/goreleaser.yaml
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/checksums.txt \
            --title "pulse-agent $GORELEASER_CURRENT_TAG" --generate-notes

  # Every push to main ships to the test VPS. Skipped until the repository
  # variable VPS_HOST is set; deploy/vps/README.md lists what the jobs need.
  deploy-vps:
    if: github.ref == 'refs/heads/main' && vars.VPS_HOST != ''
    needs: [test, integration]
    runs-on: ubuntu-latest
    concurrency:
      group: test-vps
      cancel-in-progress: false
    env:
      VPS_HOST: ${{ vars.VPS_HOST }}
      VPS_SSH_USER: ${{ vars.VPS_SSH_USER }}
    steps:
      - uses: actions/checkout@v4
        with:
          # agent-dist versions the snapshot from the latest agent/v tag.
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          install-only: true
      - run: make agent-dist
      - run: deploy/vps/ssh-setup.sh
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
      - run: deploy/vps/deploy.sh "https://$VPS_HOST:7443"

  # The app's side of the deploy: SPKI pinning and the device token against the
  # real agent, with LiveAgentClient on a simulator.
  check-vps:
    needs: deploy-vps
    runs-on: macos-15
    concurrency:
      group: test-vps-check
      cancel-in-progress: false
    env:
      VPS_HOST: ${{ vars.VPS_HOST }}
      VPS_SSH_USER: ${{ vars.VPS_SSH_USER }}
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26
        run: |
          xcode="$(find /Applications -maxdepth 1 -name 'Xcode_26*.app' | sort -V | tail -n 1)"
          sudo xcode-select -s "$xcode"
      - name: Pick a simulator
        run: |
          udid="$(xcrun simctl list devices available | sed -nE 's/^ +iPhone[^(]*\(([0-9A-F-]{36})\).*/\1/p' | head -n 1)"
          test -n "$udid" || { xcrun simctl list devices available; echo "no iPhone simulator found"; exit 1; }
          echo "IOS_DESTINATION=platform=iOS Simulator,id=$udid" >> "$GITHUB_ENV"
      - run: deploy/vps/ssh-setup.sh
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
      - run: deploy/vps/check.sh "https://$VPS_HOST:7443"
